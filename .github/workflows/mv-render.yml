name: mv-render
# Renders a song clip made with EffectCraft (effectcraft/jobs/<job>) in parallel chunks,
# then joins them, adds the cover at the end, makes a small copy and uploads both to Supabase.
on:
  workflow_dispatch:
    inputs:
      job:   { description: "job folder under effectcraft/jobs", default: "my-love" }
      lang:  { description: "he or en", default: "he" }
      name:  { description: "output file name in assets/mv/<job>/", default: "Ahuvati-he" }

env:
  ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6d3NteHdqaW1vd2Fpb3lwbHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0ODQ1MzQsImV4cCI6MjA5NDA2MDUzNH0.qwvwopCpOycOBvOPNaPzDQqOkvvYkMrQXEoBqUs0ufc
  CHUNKS: 8

jobs:
  render:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: { part: [0, 1, 2, 3, 4, 5, 6, 7] }
    steps:
      - uses: actions/checkout@v4
      - name: setup
        run: |
          sudo mkdir -p /home/claude && sudo chown $USER /home/claude
          cp -r effectcraft/jobs/${{ inputs.job }} /home/claude/mv
          mkdir -p ~/.fonts && cp /home/claude/mv/fonts/* ~/.fonts/ && fc-cache -f >/dev/null
          xz -dc effectcraft/bin-effectcraft-cli.xz > /tmp/ec && chmod +x /tmp/ec
      - name: render chunk
        run: |
          cd /home/claude/mv
          D=$(python3 -c "import json;print(json.load(open('plan-${{ inputs.lang }}.json'))['dur'])")
          read S E < <(python3 -c "
          import math; D=$D; n=$CHUNKS; p=${{ matrix.part }}; L=math.ceil(D/n)
          s=p*L; e=min(D,(p+1)*L); print(s, e)")
          echo "part ${{ matrix.part }}: $S - $E"
          /tmp/ec render --project ml-${{ inputs.lang }}.ecproj --comp ML --out part${{ matrix.part }}.mp4 --format h264 --start $S --end $E --audio off --progress | tail -n 3
      - uses: actions/upload-artifact@v4
        with:
          name: part${{ matrix.part }}
          path: /home/claude/mv/part${{ matrix.part }}.mp4
          retention-days: 3

  finish:
    needs: render
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: parts, merge-multiple: true }
      - name: join, cover, small copy
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          J=effectcraft/jobs/${{ inputs.job }}; L=${{ inputs.lang }}
          D=$(python3 -c "import json;print(json.load(open('$J/plan-$L.json'))['dur'])")
          CS=$(python3 -c "print(round($D-7,2))")
          for i in $(seq 0 $((CHUNKS-1))); do echo "file 'parts/part$i.mp4'"; done > list.txt
          ffmpeg -v error -y -f concat -safe 0 -i list.txt -c copy v.mp4
          ffmpeg -v error -y -i v.mp4 -loop 1 -i $J/cover.jpg -i $J/$L.mp3 \
            -filter_complex "[1:v]scale=860:860,format=rgba,fade=t=in:st=${CS}:d=2.5:alpha=1[cv];[0:v][cv]overlay=(W-w)/2:(H-h)/2:enable='gte(t,${CS})':shortest=1[v]" \
            -map "[v]" -map 2:a -c:v libx264 -crf 20 -preset medium -pix_fmt yuv420p -c:a aac -b:a 192k -shortest -movflags +faststart final.mp4
          VB=$(python3 -c "print(int((28.5*8*1024)/$D - 160))")
          ffmpeg -v error -y -i final.mp4 -c:v libx265 -b:v ${VB}k -x265-params pass=1:log-level=error -an -f null /dev/null
          ffmpeg -v error -y -i final.mp4 -c:v libx265 -b:v ${VB}k -x265-params pass=2:log-level=error -tag:v hvc1 -c:a aac -b:a 128k -movflags +faststart small.mp4
          ls -la final.mp4 small.mp4
      - name: upload to supabase
        run: |
          B=https://izwsmxwjimowaioyplza.supabase.co/storage/v1/object/assets/mv/${{ inputs.job }}
          N=${{ inputs.name }}
          SZ=$(stat -c%s final.mp4); F=final.mp4; [ $SZ -gt 49000000 ] && F=small.mp4
          curl -sf -X POST "$B/$N.mp4" -H "apikey: $ANON" -H "Authorization: Bearer $ANON" -H "Content-Type: video/mp4" --data-binary @$F
          curl -sf -X POST "$B/$N-small.mp4" -H "apikey: $ANON" -H "Authorization: Bearer $ANON" -H "Content-Type: video/mp4" --data-binary @small.mp4
