name: Masterphub auto videos
# 22.10.26: workflow_dispatch removed. An outside caller (n8n) dispatched this every 5 minutes
# and burned the monthly Actions minutes. Runs only on the schedule now. To restore, add back:
#   workflow_dispatch:
on:
  schedule:
    - cron: '7 */3 * * *'
concurrency: videos
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # the publishing webhooks live in repo secrets (Settings > Secrets and variables > Actions), never in code
      HUB_URL: ${{ secrets.HUB_URL }}
      CAROUSEL_HUB_URL: ${{ secrets.CAROUSEL_HUB_URL }}
      SB: https://izwsmxwjimowaioyplza.supabase.co
      ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6d3NteHdqaW1vd2Fpb3lwbHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0ODQ1MzQsImV4cCI6MjA5NDA2MDUzNH0.qwvwopCpOycOBvOPNaPzDQqOkvvYkMrQXEoBqUs0ufc
    steps:
      - name: Anything to do?
        id: check
        run: |
          if [ -z "$HUB_URL" ] || [ -z "$CAROUSEL_HUB_URL" ]; then echo "HUB_URL / CAROUSEL_HUB_URL secrets are missing"; exit 1; fi
          n=$(curl -s -X POST "$SB/rest/v1/rpc/video_pending" -H "apikey: $ANON" -H "Authorization: Bearer $ANON" -H "Content-Type: application/json" -d '{}')
          echo "pending=$n"; echo "pending=$n" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.pending != '0'
        uses: actions/checkout@v4
      - if: steps.check.outputs.pending != '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: steps.check.outputs.pending != '0'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0 && pip install -q edge-tts pillow
      - if: steps.check.outputs.pending != '0'
        name: Render and post
        run: |
          # the engine lives in this repo (engine/) - single source of truth
          cp engine/make_video.py make_video.py
          cp engine/render_v2.py render.py
          cp engine/carousel.py carousel.py
          python render.py
