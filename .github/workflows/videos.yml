name: Masterphub auto videos
on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:
concurrency: videos
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SB: https://izwsmxwjimowaioyplza.supabase.co
      ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6d3NteHdqaW1vd2Fpb3lwbHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0ODQ1MzQsImV4cCI6MjA5NDA2MDUzNH0.qwvwopCpOycOBvOPNaPzDQqOkvvYkMrQXEoBqUs0ufc
    steps:
      - name: Anything to do?
        id: check
        run: |
          n=$(curl -s -X POST "$SB/rest/v1/rpc/video_pending" -H "apikey: $ANON" -H "Authorization: Bearer $ANON" -H "Content-Type: application/json" -d '{}')
          echo "pending=$n"; echo "pending=$n" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.pending != '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: steps.check.outputs.pending != '0'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0 && pip install -q edge-tts pillow
      - if: steps.check.outputs.pending != '0'
        name: Render and post
        run: |
          curl -sf -o make_video.py "$SB/storage/v1/object/public/downloads/video-engine/make_video.py"
          curl -sf -o render.py "$SB/storage/v1/object/public/downloads/video-engine/render_v2.py"
          curl -sf -o carousel.py "$SB/storage/v1/object/public/downloads/video-engine/carousel.py"
          export CAROUSEL_HUB_URL=
          python render.py
