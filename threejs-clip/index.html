<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Heebo;src:url(a/Heebo.ttf);font-weight:100 900}
@font-face{font-family:Amatic;src:url(a/AmaticSC-Bold.ttf)}
@font-face{font-family:Homemade;src:url(a/HomemadeApple.ttf)}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#f3e9d6}
canvas{position:absolute;inset:0}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(40,20,5,.45) 100%)}
#flash{position:absolute;inset:0;background:#fff6e0;opacity:0;mix-blend-mode:screen}
#lyr{position:absolute;left:0;right:0;bottom:70px;text-align:center;font:800 64px Heebo;letter-spacing:.5px}
#lyr .w{display:inline-block;margin:0 .16em;color:transparent;-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 2px #1d1206) drop-shadow(0 0 6px rgba(20,10,0,.8));transform-origin:50% 80%}
#title{position:absolute;left:0;right:0;top:330px;text-align:center;font:230px Amatic;color:#fff7e8;opacity:0;
  text-shadow:0 0 30px rgba(255,190,110,.9),0 0 4px #3a220e}
#sig{position:absolute;left:60px;bottom:22px;font:38px Homemade;color:#fff;opacity:.85;text-shadow:0 0 3px #1a1006}
#cover{position:absolute;left:50%;top:50%;width:820px;height:820px;margin:-410px 0 0 -410px;opacity:0;border-radius:6px;
  box-shadow:0 0 60px rgba(255,190,120,.7)}
</style></head>
<body>
<div id="vig"></div><div id="flash"></div>
<div id="title"></div><div id="lyr"></div><div id="sig">stavjadam</div><img id="cover">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const LANG = new URLSearchParams(location.search).get('lang') || 'en';
const P = await (await fetch(`a/plan-${LANG}.json`)).json();
const RTL = LANG === 'he';
document.getElementById('title').textContent = RTL ? 'אהובתי' : 'My Love';
document.getElementById('lyr').dir = RTL ? 'rtl' : 'ltr';
document.getElementById('cover').src = `a/cover-${LANG}.jpg`;

const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setSize(1920, 1080); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(40, 1920 / 1080, 0.1, 100);
const loader = new THREE.TextureLoader();
const load = u => new Promise(r => loader.load(u, t => { t.colorSpace = THREE.SRGBColorSpace; r(t); }, undefined, () => r(null)));

// seeded random
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const BEATS = P.beats, ACC = P.accents, CH = P.chorus;
const last = (arr, t) => { let r = -99; for (const b of arr) { if (b <= t) r = b; else break; } return r; };
const inChorus = t => CH.some(([a, b]) => t >= a && t <= b);
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);

// glow sprite texture
function glowTex(r, g, b) {
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  const gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, `rgba(${r},${g},${b},1)`); gr.addColorStop(0.25, `rgba(${r},${g},${b},.55)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, 128, 128); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const GLOW = glowTex(255, 214, 150), GLOW2 = glowTex(255, 150, 120);

// scenes: background plane far, characters plane near => real depth
const DB = 9, DF = 5; // distances
const vis = d => { const h = 2 * d * Math.tan(THREE.MathUtils.degToRad(20)); return [h * 1920 / 1080, h]; };
const groups = [];
for (const [name, t0, t1] of P.scenes) {
  const img = name === 's11b' ? 's11' : name === 's04b' ? 's04' : name.replace(/b$/, '');
  const fg = await load(`a/${img}_fg.png`);
  const bg = await load(`a/${img}${fg ? '_bg' : ''}.jpg`);
  const g = new THREE.Group(); g.visible = false; scene.add(g);
  const asp = bg.image.width / bg.image.height;
  const [vw] = vis(DB); const W = vw * 1.22;
  const mb = new THREE.Mesh(new THREE.PlaneGeometry(W, W / asp), new THREE.MeshBasicMaterial({map: bg, transparent: true, depthWrite: false}));
  mb.position.z = -DB; g.add(mb);
  let mf = null;
  if (fg) {
    const Wf = W * DF / DB;
    mf = new THREE.Mesh(new THREE.PlaneGeometry(Wf, Wf / asp), new THREE.MeshBasicMaterial({map: fg, transparent: true, depthWrite: false}));
    mf.position.z = -DF; mf.position.y = -0.04; g.add(mf);
  }
  groups.push({name, img, t0, t1, g, mb, mf});
}

// particles: fireflies / gold dust, positions are a pure function of time
const N = 700, pts = [];
for (let i = 0; i < N; i++) pts.push({x: rnd() * 16 - 8, y: rnd() * 9 - 4.5, z: -rnd() * 9 - 0.5, s: 0.04 + rnd() * 0.12, ph: rnd() * 6.28, sp: 0.1 + rnd() * 0.35, warm: rnd() < 0.75});
const sprites = pts.map(p => { const s = new THREE.Sprite(new THREE.SpriteMaterial({map: p.warm ? GLOW : GLOW2, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, depthTest: false})); s.renderOrder = 50; scene.add(s); return s; });

// heart drawn with light
const HN = 150, heart = [];
for (let i = 0; i < HN; i++) { const a = i / HN * Math.PI * 2; heart.push([16 * Math.sin(a) ** 3 / 17, (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) / 17]); }
const hs = heart.map(() => { const s = new THREE.Sprite(new THREE.SpriteMaterial({map: GLOW2, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, depthTest: false})); s.renderOrder = 50; scene.add(s); return s; });
const head = new THREE.Sprite(new THREE.SpriteMaterial({map: GLOW, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, depthTest: false})); head.renderOrder = 60; scene.add(head);
const heartStarts = CH.map(c => c[0] + 1.0);

// warm light leak
const leak = new THREE.Sprite(new THREE.SpriteMaterial({map: glowTex(255, 160, 80), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, depthTest: false}));
leak.scale.set(14, 14, 1); scene.add(leak);

// lyrics DOM
const lyr = document.getElementById('lyr');
const lineEls = P.lines.map(L => {
  const d = document.createElement('div'); d.style.display = 'none';
  d.ws = L.w.map(([w, t], k) => { const s = document.createElement('span'); s.className = 'w'; s.textContent = w; d.appendChild(s);
    const nt = k + 1 < L.w.length ? L.w[k + 1][1] : Math.min(L.e - 0.3, t + 0.8); s.t0 = t; s.t1 = Math.max(t + 0.15, nt); return s; });
  lyr.appendChild(d); return d;
});
const flash = document.getElementById('flash'), title = document.getElementById('title'), cover = document.getElementById('cover');
const TD = 1.1;

window.renderAt = (t) => {
  const D = P.dur;
  const lb = last(BEATS, t), la = last(ACC, t);
  const pulse = Math.exp(-(t - lb) * 6), acc = Math.exp(-(t - la) * 7);
  // camera: slow sway gives the parallax, small push on beats
  cam.position.set(Math.sin(t * 0.21) * 0.55, Math.cos(t * 0.17) * 0.25, 0.4 - 0.08 * pulse - 0.25 * acc);
  cam.lookAt(Math.sin(t * 0.21) * 0.2, 0, -6);
  // scenes
  for (let i = 0; i < groups.length; i++) {
    const G = groups[i];
    const a = G.t0 - (i ? TD / 2 : 0), b = G.t1 + (i < groups.length - 1 ? TD / 2 : 0);
    if (t < a - 0.01 || t > b + 0.01) { G.g.visible = false; continue; }
    G.g.visible = true;
    const u = (t - G.t0) / Math.max(1, G.t1 - G.t0);        // 0..1 inside scene
    let z = 0.2 + 1.6 * u, op = 1, xo = (i % 2 ? 1 : -1) * (0.6 - 1.2 * u) * 0.5;
    if (i && t < G.t0 + TD / 2) { const k = ease((t - a) / TD); z += -3.5 * (1 - k); op = k; }
    if (i < groups.length - 1 && t > G.t1 - TD / 2) { const k = ease((t - (G.t1 - TD / 2)) / TD); z += 4.2 * k * k; op = 1 - k; }
    G.g.position.set(xo, 0, z);
    G.mb.material.opacity = op; if (G.mf) { G.mf.material.opacity = op; G.mf.position.y = -0.04 + Math.sin(t * 1.3) * 0.015; G.mf.rotation.z = Math.sin(t * 0.8) * 0.006; }
    G.g.renderOrder = i - 100;
  }
  // particles
  let dk = 0; for (const [ca, cb] of CH) dk = Math.max(dk, Math.min(ease((t - ca) / 2), ease((cb - t) / 2)));
  const tint = new THREE.Color(1 - 0.30 * dk, 1 - 0.38 * dk, 1 - 0.45 * dk);
  for (const G of groups) { G.mb.material.color.copy(tint); if (G.mf) G.mf.material.color.copy(tint).lerp(new THREE.Color(1,1,1), 0.35); }
  const ch = 0.55 + 0.45 * dk;
  for (let i = 0; i < N; i++) {
    const p = pts[i], s = sprites[i];
    let y = p.y + ((t * p.sp * 0.35) % 9); if (y > 4.5) y -= 9;
    s.position.set(p.x + Math.sin(t * p.sp + p.ph) * 0.4, y, p.z);
    const tw = 0.55 + 0.45 * Math.sin(t * (1.5 + p.sp * 4) + p.ph);
    const sz = p.s * (1 + 0.8 * pulse) * (p.z < -6 ? 1.6 : 1) * (1 + 0.6 * dk);
    s.scale.set(sz * 1.3, sz * 1.3, 1); s.material.opacity = Math.min(1, tw * ch * (i < N * ch ? 1 : 0.25));
  }
  // heart of light
  let hv = 0, hp = 0;
  for (const h0 of heartStarts) if (t >= h0 && t < h0 + 12) { hp = Math.min(1, (t - h0) / 4); hv = t < h0 + 10 ? 1 : 1 - (t - h0 - 10) / 2; }
  const HS = 1.85 + 0.1 * pulse;
  for (let i = 0; i < HN; i++) {
    const on = i / HN <= hp; const s = hs[i];
    s.visible = hv > 0 && on;
    s.position.set(heart[i][0] * HS, heart[i][1] * HS + 0.3, -4.2);
    const sz = 0.15 + 0.04 * Math.sin(i * 0.7 + t * 5);
    s.scale.set(sz, sz, 1); s.material.opacity = hv * 0.55;
  }
  const hi = Math.min(HN - 1, Math.floor(hp * HN));
  head.visible = hv > 0 && hp < 1; head.position.set(heart[hi][0] * HS, heart[hi][1] * HS + 0.3, -4.1); head.scale.set(0.7, 0.7, 1);
  // light leak drifting
  leak.position.set(Math.sin(t * 0.13) * 7, 2.5 + Math.cos(t * 0.11) * 1.5, -7);
  leak.material.opacity = (inChorus(t) ? 0.22 : 0.12) + 0.06 * acc;
  // DOM layers
  flash.style.opacity = (0.22 * acc).toFixed(3);
  const tIn = Math.min(1, Math.max(0, (t - 1.5) / 1.5)), tOut = Math.min(1, Math.max(0, (P.lines[0].s - 0.8 - t) / 1.5));
  title.style.opacity = Math.min(tIn, tOut).toFixed(3); title.style.transform = `scale(${0.9 + 0.12 * t / 12})`;
  const cs = D - 7; cover.style.opacity = Math.min(1, Math.max(0, (t - cs) / 2.5)).toFixed(3);
  cover.style.transform = `scale(${0.94 + 0.06 * Math.min(1, Math.max(0, (t - cs) / 7))})`;
  document.body.style.filter = t > D - 1.2 ? `brightness(${Math.max(0, (D - t) / 1.2)})` : '';
  P.lines.forEach((L, i) => {
    const el = lineEls[i];
    const vis = t >= L.s - 0.3 && t <= L.e + 0.2;
    el.style.display = vis ? 'block' : 'none'; if (!vis) return;
    const fin = Math.min(1, (t - (L.s - 0.3)) / 0.35), fout = Math.min(1, (L.e + 0.2 - t) / 0.35);
    el.style.opacity = Math.min(fin, fout); el.style.transform = `translateY(${(1 - fin) * 18}px)`;
    for (const s of el.ws) {
      const k = Math.min(1, Math.max(0, (t - s.t0) / (s.t1 - s.t0)));
      const pct = (k * 100).toFixed(1);
      const dir = RTL ? 'to left' : 'to right';
      s.style.backgroundImage = `linear-gradient(${dir}, #ffcf73 ${pct}%, #ffffff ${pct}%)`;
      const pop = t >= s.t0 ? Math.exp(-(t - s.t0) * 7) : 0;
      s.style.transform = `scale(${1 + 0.18 * pop}) translateY(${-6 * pop}px)`;
    }
  });
  window.DBG = {hp, hv, hvis: hs.filter(x=>x.visible).length, hpos: hs[10].position.toArray(), op: hs[10].material.opacity, sc: hs[10].scale.x}; renderer.render(scene, cam);
};
await document.fonts.ready;
window.READY = true;
</script></body></html>
